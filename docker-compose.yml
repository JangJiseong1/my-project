services:
  ai-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: ai-healthcare-worker
    restart: always
    depends_on:
      - redis
      - mysql
    environment:
      - DATABASE_URL=mysql+pymysql://app_user:app_password@mysql:3306/healthcare_db

  redis:
    image: redis:alpine
    container_name: my_redis_container
    ports:
      - "6379:6379"
    restart: always

  fastapi:
    build: .
    container_name: ai-healthcare-fastapi
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=mysql+pymysql://app_user:app_password@mysql:3306/healthcare_db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    container_name: ai-healthcare-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: healthcare_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: