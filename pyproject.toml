[project]
name = "my-fastapi-project"
version = "0.1.0"
description = "Add your description here"

authors = [
    { name = "JangJiseong1", email = "joigoi1562@naver.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.12.0",
    "sqlalchemy>=2.0.0",
    "redis>=4.5.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pymysql>=1.1.0",
]
ai = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
]



[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"